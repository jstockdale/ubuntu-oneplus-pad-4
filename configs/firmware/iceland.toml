# Firmware manifest for iceland (OnePlus Pad 4), stock 11.A.38 — phase 1.
#
# Sources and SHA-256s cross-referenced from MANIFEST.tsv of
# github.com/mzakamin-hub/iceland-firmware (built from the same stock
# 11.A.38), regenerated 2026-10-29. stage-firmware.py still
# extracts every byte from the OWNER's own staged OTA partitions and
# refuses on any hash mismatch, so the two independent sources must agree
# or nothing ships. Hashes are of the DESTINATION file (after the
# transform, where one applies).
#
# transform values: fwup-strip-80-128 (drop an 80-byte header and a
# 128-byte trailer), pil-join (join .mdt + .bNN siblings into one ELF,
# pil-squasher equivalent). Absent means byte copy.
#
# Out of scope for phase 1, deliberately: the sensor-hub dsp tree, sensor
# configs and registry (needs the sensors userspace), audio calibration
# database (needs the sound card up), the thermal model (their decoder is
# unpublished), socinfo (generated on device).

