# Power key policy until suspend is qualified (C6): a short press is
# ignored by logind (GNOME's power-button-action takes over in a session;
# on a blanked console a wake-press must not power the tablet off), a long
# press still powers off cleanly. The tb323fu port ships the same pair.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
