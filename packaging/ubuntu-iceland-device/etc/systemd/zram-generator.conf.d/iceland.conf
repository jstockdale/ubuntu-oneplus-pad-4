# First swap tier: zstd zram, as on the gts9u port.  The second tier (a
# swapfile on the grown root filesystem) arrives with its own service once
# memory pressure has actually been observed on this device; shipping it
# day one would be cargo culting a fix for a problem not yet measured here.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
