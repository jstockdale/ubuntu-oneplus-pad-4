# Inbound ssh is a primary access path on this port; the WCN7860's
# firmware implements real station power save, which adds seconds of
# latency to unsolicited inbound traffic and, on 2026-11-02, left the
# tablet unreachable twice within minutes of going idle. Keep it off.
#
# Placement matters: Ubuntu ships /etc/NetworkManager/conf.d/
# default-wifi-powersave-on.conf (wifi.powersave = 3), and NetworkManager
# merges conf.d files in lexical order with /etc shadowing /usr/lib only
# by equal name. The 0.2.x file under /usr/lib/NetworkManager/conf.d/
# (30-iceland-wifi.conf) sorted before "default-..." and lost: the merged
# config read 3 and `iw dev wlan0 get power_save` said on. This name
# sorts last. Verify with: NetworkManager --print-config | grep powersave
[connection]
wifi.powersave = 2
