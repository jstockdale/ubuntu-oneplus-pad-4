# OnePlus Pad 4: /etc/iceland/pen.conf for iceland-pen (ladder A.3c N5).
# Identifiers learned from the bonded OnePlus Stylo Pro on 2026-11-03.
# BlueZ names characteristics by their declaration handle; the stock log's
# value handles are one higher (0x0067 there = char0066 here).
[pen]
name = OnePlus Stylo Pro
sysfs = /sys/bus/spi/devices/spi0.0

[gatt]
# char0066: receives the controller's 20-byte timing block (write with
# response) and streams the tip pressure back (aa 01 01 02 <u16>).
timing_uuid = 0783b03e-8535-b5a0-7140-a304d2495cbb
# char0053: the pen's text console (Nordic UART TX), logged as ASCII.
log_uuid = 6e400003-b5a3-f393-e0a9-e50e24dcca9e
# char003c: the status channel ("2c 90 01 01 xx"); request bytes unknown yet.
status_uuid = 18093046-2a69-11ec-8d3d-0242ac130003
status_request =
notify_uuids = 0783b03e-8535-b5a0-7140-a304d2495cbb, 18093046-2a69-11ec-8d3d-0242ac130003, 180938ac-2a69-11ec-8d3d-0242ac130003, 1809396a-2a69-11ec-8d3d-0242ac130003, 180932da-2a69-11ec-8d3d-0242ac130003, 180937bc-2a69-11ec-8d3d-0242ac130003, 6e400003-b5a3-f393-e0a9-e50e24dcca9e
# The sequence that opened the controller's pen decoder on 2026-11-03
# (values as stock's daemon sends them).
after_timing = cfg_id 1, pen_info 2, con_sta 1, timing_ack 1, hopfrq_ack 1
# Console lines on log_uuid that mean the pen woke up: replay the handshake.
wake_words = sleep exit

[rules]

[buttons]
# <button number> = <notify uuid> <press bytes> <release bytes>
# char0047 sends 02 on press and 03 on release of the barrel button.
1 = 180938ac-2a69-11ec-8d3d-0242ac130003 02 03
