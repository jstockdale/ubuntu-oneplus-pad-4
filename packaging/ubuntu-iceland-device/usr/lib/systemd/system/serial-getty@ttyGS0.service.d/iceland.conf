# serial-getty@ttyGS0 — iceland override.
#
# The stock template binds the getty to dev-ttyGS0.device, a unit that
# exists only once udev announces the tty. The node itself is created by
# the kernel as soon as the ACM function exists (configfs gadget on
# release kernels, g_serial on diagnostic ones) — no udev involved. In
# diagnostic or degraded boots where udev is masked or starved, the
# device unit never appears and the bind holds login hostage; measured
# on flights v18/v20. Drop the bind and wait for the node directly, so
# the serial login works in every configuration.

[Unit]
BindsTo=
After=ubuntu-iceland-usb-gadget.service

[Service]
ExecStartPre=/bin/sh -c 'n=0; while [ ! -c /dev/ttyGS0 ] && [ "$n" -lt 120 ]; do sleep 1; n=$((n+1)); done; [ -c /dev/ttyGS0 ]'
RestartSec=2
