# ABL hands off with the APSS watchdog armed and the qcom-wdt probe
# re-arms it to 30 s; the kernel's HANDLE_BOOT_ENABLED worker has been
# measured not to engage on this hardware (hard reset at T+~33 s, the
# re-armed period). PID 1 owns the dog instead, like the sibling ports.
[Manager]
RuntimeWatchdogSec=15s
