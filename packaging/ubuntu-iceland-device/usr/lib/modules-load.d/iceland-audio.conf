# OnePlus Pad 4: the audio chain's modules, loaded by systemd-modules-load at
# boot whether or not udev's coldplug asks for them.
#
# On 2026-11-02 one boot (kernel #43, RAM-booted) came up with four of them
# missing: snd_soc_lpass_va_macro, snd_soc_lpass_tx_macro,
# snd_soc_lpass_wsa_macro and soundwire_qcom. udev had processed their
# devices (USEC_INITIALIZED set at 1.69 s, right after the coldplug), the
# same aliases resolved by hand, and the previous boots loaded all of them
# by themselves. The rx macro then waited forever for the va macro's fsgen
# clock, the machine driver for its codec DAI, and no sound card registered
# until the four were modprobed by hand. Listing the set here makes the load
# deterministic; the kernel still orders the probes (deferred probe), so a
# driver loaded before the ADSP's audio domain is up simply waits.
#
# iceland-audio-check.service verifies the card after boot and logs (and
# repairs) a recurrence, so the count of misses stays visible in the journal.
qcom_pd_mapper
soundwire_qcom
snd_soc_lpass_va_macro
snd_soc_lpass_tx_macro
snd_soc_lpass_rx_macro
snd_soc_lpass_wsa_macro
snd_soc_wcd939x_sdw
snd_soc_wcd939x
snd_soc_tfa9865
q6apm_dai
q6apm_lpass_dais
q6prm_clocks
snd_soc_sc8280xp
