# pwrseq_qcom_wcn: probing the WCN7860 power sequencer hard-resets the
# SoC (bisected twice, 2026-10-31). The sibling kaanapali board wires
# the same pins (TLMM 16 wlan-enable, PMH gpio5 bt-enable) and works,
# so the suspect is an OPLUS-firmware XPU protection on one of those
# writes. Keep it out until the WLAN phase splits the node and the DT
# reserves the guilty pin properly.
blacklist pwrseq_qcom_wcn
# nt36536_ts: the TDDI touch probe resets the live panel IC before
# deferring. Hold until the display phase ships a panel driver.
blacklist nt36536_ts
