# OnePlus Pad 4 (iceland): the card's playback and capture PCMs are timed by
# the audio DSP independently, and the capture PCM reports its delay in
# steps of a whole period (40 ms). When both run at once (a call, GNOME's
# input meter while something plays), PipeWire makes one device a follower
# of the other; as long as both carried the same default clock name the
# follower was not rate-matched and PipeWire "resync"ed it on every step —
# audible crackle on the speakers while the mic was open (2026-11-02, first
# seen with the processed microphone of 0.2.26 whose echo reference links
# the two devices).
#
# Two of the three parts of the fix live here: the capture node gets its own
# clock domain so a follower is rate-matched instead of hard-resynced, and
# the speaker sink is preferred as the graph driver so playback never
# follows. The third part — a graph quantum large enough that the capture
# follower's delay steps stay under the resync threshold — is
# pipewire.conf.d/64-iceland-clock.conf. Measured: 51 resyncs per 3 min
# before; 0 in 34 s with the mic held open after all three.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.platform-sound.HiFi__Mic__source" } ]
    actions = { update-props = { clock.name = "api.alsa.0.capture" } }
  }
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = { update-props = { priority.driver = 3000 } }
  }
]
