# OnePlus Pad 4 (iceland): keep PipeWire's volume in software on top of the
# pinned DSP stream gain — the vol_ctrl control's dB metadata is wrong
# (1 dB/step), so hardware-mixer volume would miscalibrate. Same approach as
# the phonewave port (devices/iceland 51-pad4-audio.conf); the Fedora port
# reaches the same end by omitting PlaybackMixerElem in its UCM.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        device.description = "OnePlus Pad 4"
      }
    }
  }
]
