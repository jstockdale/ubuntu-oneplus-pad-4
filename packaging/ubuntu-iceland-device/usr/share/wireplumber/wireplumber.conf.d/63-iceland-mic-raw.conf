# OnePlus Pad 4 (iceland): name the raw UCM microphone source so Sound
# settings tell it apart from "Internal microphones (voice processing)"
# (60/61-iceland-mic-*.conf). Its priority stays the UCM's (CapturePriority
# 100 → 1712): below the processed source (2000), so that one is the
# default; above the speaker chain's monitor. Not hidden: the echo canceller
# records from it, and recordings without processing remain possible.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.platform-sound.HiFi__Mic__source" } ]
    actions = {
      update-props = {
        node.description = "Internal microphones (raw)"
      }
    }
  }
]
