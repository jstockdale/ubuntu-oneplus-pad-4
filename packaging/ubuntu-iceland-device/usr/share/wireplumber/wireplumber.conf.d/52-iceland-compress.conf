# OnePlus Pad 4 (iceland): the AudioReach card exposes a compressed-audio node
# (/dev/snd/comprC0D*) that WirePlumber's ALSA monitor emits as a SECOND card
# object (alsa_card.comprC0) for the same hw:0. Both objects then contend for
# org.freedesktop.ReserveDevice1.Audio0 ("wp_reserve_device_own_name: assertion
# 'self->owner_id == 0' failed" at every boot) and whichever loses the
# reservation is switched to profile "off" — when that is the real card, every
# sink and source disappears mid-session ("No Input Devices", silent Chrome;
# seen twice on 2026-11-02 with WirePlumber 0.5.13 / PipeWire 1.6.2). Do not
# create a device for the compress node; the real card keeps HiFi.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.compr.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
