# OnePlus Pad 4 (iceland): minimum graph quantum 2048 frames (42.7 ms at
# 48 kHz). The capture PCM of this card reports its delay in whole 40 ms
# periods; as a follower of the speaker sink its delay error therefore
# jumps by up to ~1700 frames, and PipeWire resyncs a follower whose error
# exceeds the quantum. With the quantum pinned above that step the follower
# is rate-matched quietly (measured 2026-11-02: 16 resyncs per 36 s at the
# default quantum, 0 at 2048). The companion rules are
# wireplumber.conf.d/64-iceland-clocks.conf. Cost: every stream's minimum
# latency becomes ~43 ms, fine for playback and calls on a tablet; a
# low-latency use case can lower it for its own session with
# pw-metadata -n settings 0 clock.min-quantum <frames>.
context.properties = {
    default.clock.min-quantum = 2048
}
