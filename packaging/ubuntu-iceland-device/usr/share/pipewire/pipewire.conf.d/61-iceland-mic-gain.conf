# OnePlus Pad 4 (iceland): the processed microphone, stage 2 of 2 — stock's
# 14 dB recorder gain, added AFTER the echo canceller of
# 60-iceland-mic-processing.conf, on the processed signal only.
#
# Why after and not in the codec: with the decimators at 84 + 14 dB the
# speakers' own echo clipped the raw capture in front of the canceller (the
# Fedora port measured tens of thousands of clipped samples), and a clipped
# echo cannot be cancelled. At 84 the canceller sees stock's headroom; this
# stage restores the level where stock's DSP does.
#
# Why a limiter and not a plain gain: the WebRTC gain control may already
# peak near full scale with a loud talker close to the glass, and +14 dB on
# that would clip. The fast look-ahead limiter (swh-plugins, the speaker
# chain's limiter) applies the +14 dB inside the plugin in float and holds
# the output at -1 dBFS with 1-2 ms look-ahead; normal speech passes
# untouched. The plugin is stereo: the one voice channel uses input/output 1,
# PipeWire feeds the other input silence.
#
# Priority 2000 puts this source above the raw one (UCM CapturePriority 100
# → 1712) and above the speaker chain's monitor (1000), so WirePlumber makes
# it the default input for accounts that never chose one; a choice saved in
# Sound settings is kept. Fail-safe: without the LADSPA plugin the module is
# skipped and the raw microphone is the default. Off switch: the same
# property as stage 1 (iceland.mic-processing = false).
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
        condition = [ { iceland.mic-processing = !false } ]
        args = {
            node.description = "Internal microphones (voice processing)"
            media.name       = "Internal microphones (voice processing)"
            filter.graph = {
                nodes = [
                    { type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)" = 14
                            "Limit (dB)" = -1
                            "Release time (s)" = 0.25
                        }
                    }
                ]
                inputs  = [ "lim:Input 1" ]
                outputs = [ "lim:Output 1" ]
            }
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name          = "capture.iceland_mic_gain"
                node.description   = "Voice processing gain"
                # the echo canceller's hidden output
                target.object      = "iceland_mic_aec"
                node.passive       = true
                node.dont-fallback = true
                node.linger        = true
                stream.dont-remix  = true
            }
            playback.props = {
                node.name        = "iceland_mic_processed"
                node.description = "Internal microphones (voice processing)"
                media.class      = Audio/Source
                priority.session = 2000
                priority.driver  = 2000
            }
        }
    }
]
