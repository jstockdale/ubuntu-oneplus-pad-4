# SPDX-License-Identifier: BSD-3-Clause
# OnePlus Pad 4 (iceland): the processed microphone, stage 1 of 2.
#
# Why: the UCM keeps the codec at stock's register values (ADC1/ADC2 14, the
# TX decimators at 84 = 0 dB), which is where stock's echo canceller wants
# its input; stock then adds about 14 dB of recorder gain in its DSP chain.
# Without this stage the raw source is that 14 dB quieter than stock and
# GNOME's input meter barely moves (owner, 2026-11-02). The design follows the
# Fedora iceland port's processed microphone (mzakamin-hub/iceland-mainline,
# packaging/iceland-device, no license declared): PipeWire's echo-cancel
# module with the WebRTC backend (Ubuntu: libspa-0.2-modules ships
# spa-0.2/aec/libspa-aec-webrtc.so) turns the raw UCM source into a hidden
# echo-cancelled node with gain control, noise suppression and a high-pass
# filter; 61-iceland-mic-gain.conf adds stock's 14 dB after it under a
# limiter and is the visible "Internal microphones (voice processing)".
#
# monitor.mode: the default sink's monitor is the echo reference, no extra
# sink appears. Both streams are passive: the microphone opens only while
# something records from the processed source.
#
# Fail-safe: ifexists + nofail. Without the module or its backend PipeWire
# starts as before (then 61-iceland-mic-gain.conf's source has no input and
# still wins by priority: pick "Internal microphones (raw)" in Sound
# settings, or switch both stages off with the property below).
#
# Off switch, both stages: a drop-in with the one line
#     context.properties = { iceland.mic-processing = false }
# in /etc/pipewire/pipewire.conf.d/ (every account) or
# ~/.config/pipewire/pipewire.conf.d/ (one account), then
# systemctl --user restart pipewire.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        flags = [ ifexists nofail ]
        condition = [ { iceland.mic-processing = !false } ]
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            # one voice channel: the two analog microphones (AMIC1 bottom,
            # AMIC5 back) are mixed down
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            node.latency = 480/48000
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = true
                # the full canceller, not the reduced phone variant
                webrtc.mobile_mode = false
            }
            capture.props = {
                node.name = "capture.iceland_mic_processed"
                node.description = "Voice processing capture"
                # the raw UCM source of the Pad 4
                target.object = "alsa_input.platform-sound.HiFi__Mic__source"
                node.passive = true
                node.dont-fallback = true
                # the ALSA source appears after this module at every start:
                # wait for it instead of being destroyed by WirePlumber
                node.linger = true
            }
            sink.props = {
                node.name = "capture.iceland_mic_reference"
                node.passive = true
            }
            source.props = {
                # hidden; the visible source is 61-iceland-mic-gain.conf's
                node.name = "iceland_mic_aec"
                node.description = "Voice processing (echo cancelled, before the 14 dB gain)"
                media.class = "Audio/Source/Internal"
            }
        }
    }
]
